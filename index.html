  <!-- Script Tambah Slide Manual & Handling Skeleton Loading Animation -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const allImages = document.querySelectorAll("img");

      allImages.forEach((img) => {
        const wrapper = img.closest(".skeleton-wrapper") || img.closest(".carousel-item");

        function removeSkeleton() {
          img.classList.add("img-loaded");
          if (wrapper) {
            wrapper.classList.remove("animate-pulse", "bg-stone-300");
          }
        }

        if (img.complete) {
          removeSkeleton();
        } else {
          img.addEventListener("load", removeSkeleton);
          img.addEventListener("error", removeSkeleton);
        }
      });
    });

    function addExternalSlide(imageUrl, altText = 'Slide Tambahan') {
      const carouselContainer = document.getElementById('carouselSlides');
      const newSlide = document.createElement('div');
      newSlide.className = 'carousel-item bg-stone-300 animate-pulse skeleton-wrapper min-h-[200px] md:min-h-[350px]';
      
      const newImg = document.createElement('img');
      newImg.src = imageUrl;
      newImg.alt = altText;
      newImg.className = 'd-block w-100 max-h-[450px] object-cover img-loading';
      
      newImg.addEventListener('load', function() {
        newImg.classList.add('img-loaded');
        newSlide.classList.remove('animate-pulse', 'bg-stone-300');
      });

      newSlide.appendChild(newImg);
      carouselContainer.appendChild(newSlide);
    }
  </script>
